<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RulettStadistic</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('ruleta.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
}

.overlay {
    background: rgba(0,0,0,0.75);
    min-height: 100vh;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.panel {
    background: rgba(20,20,20,0.9);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

input, textarea, button {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 5px;
    border: none;
}

button {
    background: #c9a227;
    font-weight: bold;
    cursor: pointer;
}

.resultado {
    margin-top: 10px;
    font-size: 15px;
}
</style>
</head>

<body>
<div class="overlay">

<h1>🎰 RulettStadistic</h1>

<div class="panel">
<h3>Añadir número individual</h3>
<input type="number" id="numIndividual" min="0" max="36">
<button onclick="addSingle()">Añadir</button>
</div>

<div class="panel">
<h3>Añadir hasta 200 números de golpe</h3>
<textarea id="bulkNumbers" rows="4" placeholder="Ej: 17,32,0,4,21..."></textarea>
<button onclick="addBulk()">Añadir todos</button>
</div>

<div class="panel">
<h3>Análisis tras número</h3>
<input type="number" id="numAnalizar" min="0" max="36">
<button onclick="analizar()">Analizar</button>
<div class="resultado" id="resultado"></div>
</div>

</div>

<script>
let historial = [];

const colores = {
0: "Verde",
1:"Roja",3:"Roja",5:"Roja",7:"Roja",9:"Roja",12:"Roja",14:"Roja",16:"Roja",18:"Roja",
19:"Roja",21:"Roja",23:"Roja",25:"Roja",27:"Roja",30:"Roja",32:"Roja",34:"Roja",36:"Roja"
};

function getColor(n){ return colores[n] || "Negra"; }
function docena(n){ if(n==0) return "0"; if(n<=12) return "1ª"; if(n<=24) return "2ª"; return "3ª"; }
function columna(n){ if(n==0) return "0"; return ((n-1)%3)+1; }

function addSingle(){
    let n = parseInt(numIndividual.value);
    if(n>=0 && n<=36) historial.push(n);
    alert("Total números: "+historial.length);
}

function addBulk(){
    let nums = bulkNumbers.value.split(",").map(n=>parseInt(n.trim())).filter(n=>n>=0 && n<=36);
    historial.push(...nums);
    alert("Total números: "+historial.length);
}

function analizar(){
    if(historial.length < 200){
        resultado.innerHTML = "⚠️ Añade al menos 200 números";
        return;
    }

    let n = parseInt(numAnalizar.value);
    let siguientes = [];

    for(let i=0;i<historial.length-1;i++){
        if(historial[i] === n) siguientes.push(historial[i+1]);
    }

    let freq = {};
    siguientes.forEach(x=>freq[x]=(freq[x]||0)+1);

    let top = Object.entries(freq)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10)
        .map(x=>x[0]);

    let colorCount={}, docCount={}, colCount={};

    siguientes.forEach(x=>{
        let c=getColor(x), d=docena(x), col=columna(x);
        colorCount[c]=(colorCount[c]||0)+1;
        docCount[d]=(docCount[d]||0)+1;
        colCount[col]=(colCount[col]||0)+1;
    });

    function topKey(obj){
        return Object.entries(obj).sort((a,b)=>b[1]-a[1])[0];
    }

    let c=topKey(colorCount);
    let d=topKey(docCount);
    let col=topKey(colCount);

    resultado.innerHTML = `
<b>${n}</b> → ${top.join(", ")}<br><br>
🎨 Color: ${c[0]} (${Math.round(c[1]/siguientes.length*100)}%)<br>
📦 Docena: ${d[0]} (${Math.round(d[1]/siguientes.length*100)}%)<br>
📊 Columna: ${col[0]} (${Math.round(col[1]/siguientes.length*100)}%)
`;
}
</script>

</body>
</html>
