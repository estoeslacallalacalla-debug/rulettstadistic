<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RulettStadistic</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

body {
    background-image: url("https://images.unsplash.com/photo-1542314831-068cd1dbfeeb");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.overlay {
    min-height: 100vh;
    background: rgba(0,0,0,0.75);
    padding: 20px;
    box-sizing: border-box;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.panel {
    background: rgba(20,20,20,0.9);
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
}

input, textarea, button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 6px;
    border: none;
    font-size: 15px;
}

button {
    background: #c9a227;
    color: black;
    font-weight: bold;
}

.resultado {
    margin-top: 10px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="overlay">

<h1>🎰 RulettStadistic</h1>

<div class="panel">
<h3>Añadir número individual</h3>
<input type="number" id="numIndividual" min="0" max="36">
<button onclick="addSingle()">Añadir</button>
</div>

<div class="panel">
<h3>Añadir hasta 200 números de golpe</h3>
<textarea id="bulkNumbers" rows="4" placeholder="Ej: 17,32,0,4,21..."></textarea>
<button onclick="addBulk()">Añadir todos</button>
</div>

<div class="panel">
<h3>Análisis tras número</h3>
<input type="number" id="numAnalizar" min="0" max="36">
<button onclick="analizar()">Analizar</button>
<div class="resultado" id="resultado"></div>
</div>

</div>

<script>
let historial = [];

const rojos = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

function color(n){
    if(n===0) return "Verde";
    return rojos.includes(n) ? "Roja" : "Negra";
}

function docena(n){
    if(n===0) return "0";
    if(n<=12) return "1ª";
    if(n<=24) return "2ª";
    return "3ª";
}

function columna(n){
    if(n===0) return "0";
    return ((n-1)%3)+1;
}

function addSingle(){
    let n = Number(numIndividual.value);
    if(n>=0 && n<=36) historial.push(n);
    alert("Total números: "+historial.length);
}

function addBulk(){
    let nums = bulkNumbers.value.split(",")
        .map(x=>Number(x.trim()))
        .filter(x=>x>=0 && x<=36);
    historial.push(...nums);
    alert("Total números: "+historial.length);
}

function analizar(){
    if(historial.length < 200){
        resultado.innerHTML = "⚠️ Introduce al menos 200 números";
        return;
    }

    let base = Number(numAnalizar.value);
    let sig = [];

    for(let i=0;i<historial.length-1;i++){
        if(historial[i]===base) sig.push(historial[i+1]);
    }

    let freq = {};
    sig.forEach(n=>freq[n]=(freq[n]||0)+1);

    let top10 = Object.entries(freq)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10)
        .map(e=>e[0]);

    let stats = {color:{}, doc:{}, col:{}};

    sig.forEach(n=>{
        stats.color[color(n)] = (stats.color[color(n)]||0)+1;
        stats.doc[docena(n)] = (stats.doc[docena(n)]||0)+1;
        stats.col[columna(n)] = (stats.col[columna(n)]||0)+1;
    });

    function best(o){
        let t = Object.entries(o).sort((a,b)=>b[1]-a[1])[0];
        return `${t[0]} (${Math.round(t[1]/sig.length*100)}%)`;
    }

    resultado.innerHTML = `
<b>${base}</b> → ${top10.join(", ")}<br><br>
🎨 Color: ${best(stats.color)}<br>
📦 Docena: ${best(stats.doc)}<br>
📊 Columna: ${best(stats.col)}
`;
}
</script>

</body>
</html>
