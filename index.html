<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RulettStadistic</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
  margin: 0;
  padding: 20px;
}
h1 {
  text-align: center;
  color: #38bdf8;
}
input, button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  font-size: 16px;
}
button {
  background: #22c55e;
  border: none;
  cursor: pointer;
}
button:hover {
  background: #16a34a;
}
.box {
  background: #020617;
  padding: 15px;
  margin-top: 15px;
  border-radius: 8px;
}
.number {
  display: inline-block;
  margin: 3px;
  padding: 6px 8px;
  background: #1e293b;
  border-radius: 4px;
}
.hot {
  background: #dc2626;
}
</style>
</head>

<body>

<h1>🎰 RulettStadistic</h1>

<div class="box">
  <input type="number" id="num" placeholder="Introduce número (0-36)">
  <button onclick="addNumber()">Añadir número</button>
</div>

<div class="box">
  <h3>Historial</h3>
  <div id="history"></div>
</div>

<div class="box">
  <h3>Números más repetidos</h3>
  <div id="stats"></div>
</div>

<script>
let history = [];
let count = {};

function addNumber() {
  const input = document.getElementById("num");
  const n = parseInt(input.value);

  if (isNaN(n) || n < 0 || n > 36) return;

  history.push(n);
  count[n] = (count[n] || 0) + 1;

  input.value = "";
  render();
}

function render() {
  const h = document.getElementById("history");
  h.innerHTML = history.map(n => `<span class="number">${n}</span>`).join("");

  const s = document.getElementById("stats");
  s.innerHTML = "";

  Object.keys(count)
    .sort((a,b)=>count[b]-count[a])
    .forEach(n=>{
      const cls = count[n] >= 3 ? "number hot" : "number";
      s.innerHTML += `<span class="${cls}">${n} (${count[n]})</span>`;
    });
}
</script>

</body>
</html>
