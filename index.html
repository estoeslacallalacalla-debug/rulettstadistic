<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RulettStadistic – Ruleta Europea</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  color: #fff;
  background: 
    linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
    url("https://images.unsplash.com/photo-1583337130417-3346a1be7dee");
  background-size: cover;
  background-attachment: fixed;
}

h1 { text-align:center; color:#facc15; }

.box {
  background: rgba(2,6,23,.85);
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
}

input, textarea, button {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  font-size: 16px;
}

button {
  background:#16a34a;
  border:none;
  color:#fff;
  cursor:pointer;
}

button:hover { background:#15803d; }

.number {
  display:inline-block;
  margin:3px;
  padding:6px 8px;
  background:#1e293b;
  border-radius:4px;
}

.badge {
  padding:2px 6px;
  border-radius:4px;
  font-size:12px;
}

.red { background:#dc2626; }
.black { background:#000; }
.green { background:#16a34a; }
</style>
</head>

<body>

<h1>🎡 RulettStadistic – Ruleta Europea</h1>

<div class="box">
<input type="number" id="num" placeholder="Número (0-36)">
<button onclick="addNumber()">Añadir número</button>
<textarea id="bulk" placeholder="Pega muchos números (17,4,32,0,9)"></textarea>
<button onclick="addBulk()">Añadir lista</button>
</div>

<div class="box">
<h3>Historial</h3>
<div id="history"></div>
</div>

<div class="box">
<h3>Transiciones</h3>
<div id="transitions"></div>
</div>

<div class="box">
<h3>🔍 Análisis avanzado (200+ números)</h3>
<div id="advanced">Introduce al menos 200 números.</div>
</div>

<script>
let historyArr=[];
let colors={0:'green',1:'red',2:'black',3:'red',4:'black',5:'red',6:'black',7:'red',8:'black',9:'red',10:'black',11:'black',12:'red',13:'black',14:'red',15:'black',16:'red',17:'black',18:'red',19:'red',20:'black',21:'red',22:'black',23:'red',24:'black',25:'red',26:'black',27:'red',28:'black',29:'red',30:'black',31:'black',32:'red',33:'black',34:'red',35:'black',36:'red'};

const docena=n=>n>=1&&n<=12?1:n<=24?2:3;
const columna=n=>n%3===1?1:n%3===2?2:3;

function addNumber(){
  let n=parseInt(num.value);
  if(n>=0&&n<=36){ historyArr.push(n); num.value=""; render(); }
}

function addBulk(){
  bulk.value.split(/[\s,;]+/).forEach(v=>{
    let n=parseInt(v);
    if(n>=0&&n<=36) historyArr.push(n);
  });
  bulk.value=""; render();
}

function render(){
  history.innerHTML=historyArr.map(n=>`<span class="number">${n}</span>`).join("");

  let trans={};
  for(let i=0;i<historyArr.length-1;i++){
    let a=historyArr[i],b=historyArr[i+1];
    if(!trans[a]) trans[a]={};
    trans[a][b]=(trans[a][b]||0)+1;
  }

  let tHTML="";
  Object.keys(trans).forEach(n=>{
    tHTML+=`<b>${n} →</b><br>`;
    Object.keys(trans[n]).sort((a,b)=>trans[n][b]-trans[n][a]).forEach(x=>{
      tHTML+=`${x} <span class="badge ${colors[x]}">${colors[x]}</span> (${trans[n][x]})<br>`;
    });
    tHTML+="<br>";
  });
  transitions.innerHTML=tHTML;

  if(historyArr.length<200){
    advanced.innerHTML="Introduce al menos 200 números.";
    return;
  }

  let last=historyArr.at(-1);
  let data=trans[last]||{};
  let total=Object.values(data).reduce((a,b)=>a+b,0);

  let colorC={},docC={},colC={};
  Object.keys(data).forEach(n=>{
    let c=data[n];
    colorC[colors[n]]=(colorC[colors[n]]||0)+c;
    docC[docena(n)]=(docC[docena(n)]||0)+c;
    colC[columna(n)]=(colC[columna(n)]||0)+c;
  });

  let top10=Object.keys(data).sort((a,b)=>data[b]-data[a]).slice(0,10);

  advanced.innerHTML=`
<b>${last} →</b> ${top10.join(", ")}<br><br>
Color dominante: <b>${maxKey(colorC)} (${perc(colorC)}%)</b><br>
Docena dominante: <b>${maxKey(docC)}ª (${perc(docC)}%)</b><br>
Columna dominante: <b>${maxKey(colC)}ª (${perc(colC)}%)</b>
`;
}

const maxKey=o=>Object.keys(o).reduce((a,b)=>o[a]>o[b]?a:b);
const perc=o=>Math.round((Math.max(...Object.values(o))/Object.values(o).reduce((a,b)=>a+b,0))*100);
</script>

</body>
</html>
