<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RulettStadistic</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0a2a4a;
    color:white;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

h1{
    text-align:center;
}

.box{
    background:#112f4d;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

input, textarea, button{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:none;
    border-radius:6px;
    font-size:15px;
}

button{
    background:#d4af37;
    font-weight:bold;
}

.result{
    margin-top:10px;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>🎰 RulettStadistic</h1>

<div class="box">
<b>Añadir número individual</b>
<input type="number" id="single" min="0" max="36">
<button onclick="addSingle()">Añadir</button>
</div>

<div class="box">
<b>Añadir hasta 200 números de golpe</b>
<textarea id="bulk" rows="4" placeholder="Ej: 17,32,0,4,21..."></textarea>
<button onclick="addBulk()">Añadir todos</button>
</div>

<div class="box">
<b>Análisis tras número</b>
<input type="number" id="target" min="0" max="36">
<button onclick="analyze()">Analizar</button>
<div class="result" id="result"></div>
</div>

<div class="box">
<button onclick="resetAll()" style="background:#c0392b;color:white;">
🗑️ Borrar todo el historial
</button>
</div>

</div>

<script>
let history = [];

const red = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

function color(n){
    if(n===0) return "Verde";
    return red.includes(n) ? "Roja" : "Negra";
}
function dozen(n){
    if(n===0) return "0";
    if(n<=12) return "1ª";
    if(n<=24) return "2ª";
    return "3ª";
}
function column(n){
    if(n===0) return "0";
    return ((n-1)%3)+1;
}

function addSingle(){
    let n = Number(single.value);
    if(n>=0 && n<=36) history.push(n);
    alert("Total números: "+history.length);
}

function addBulk(){
    let nums = bulk.value.split(",")
        .map(x=>Number(x.trim()))
        .filter(x=>x>=0 && x<=36);
    history.push(...nums);
    alert("Total números: "+history.length);
}

function resetAll(){
    history = [];
    result.innerHTML = "";
    alert("Historial borrado");
}

function analyze(){
    if(history.length < 200){
        result.innerHTML = "⚠️ Introduce mínimo 200 números";
        return;
    }

    let base = Number(target.value);
    let nextNums = [];

    for(let i=0;i<history.length-1;i++){
        if(history[i] === base){
            nextNums.push(history[i+1]);
        }
    }

    if(nextNums.length === 0){
        result.innerHTML = "No hay datos suficientes para este número";
        return;
    }

    let freq = {};
    nextNums.forEach(n => freq[n]=(freq[n]||0)+1);

    let top10 = Object.entries(freq)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10)
        .map(e=>e[0]);

    let stats = {color:{}, dozen:{}, column:{}};

    nextNums.forEach(n=>{
        stats.color[color(n)] = (stats.color[color(n)]||0)+1;
        stats.dozen[dozen(n)] = (stats.dozen[dozen(n)]||0)+1;
        stats.column[column(n)] = (stats.column[column(n)]||0)+1;
    });

    function best(obj){
        let t = Object.entries(obj).sort((a,b)=>b[1]-a[1])[0];
        return `${t[0]} (${Math.round(t[1]/nextNums.length*100)}%)`;
    }

    result.innerHTML = `
<b>${base}</b> → ${top10.join(", ")}<br><br>
🎨 Color: ${best(stats.color)}<br>
📦 Docena: ${best(stats.dozen)}<br>
📊 Columna: ${best(stats.column)}
`;
}
</script>

</body>
</html>
