<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RulettStadistic – Ruleta Europea</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
  margin: 0;
  padding: 20px;
}
h1 {
  text-align: center;
  color: #38bdf8;
}
input, textarea, button {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  font-size: 16px;
}
textarea { min-height: 80px; }
button {
  background: #22c55e;
  border: none;
  cursor: pointer;
}
button:hover { background: #16a34a; }
.box {
  background: #020617;
  padding: 15px;
  margin-top: 15px;
  border-radius: 8px;
}
.number {
  display: inline-block;
  margin: 3px;
  padding: 6px 8px;
  background: #1e293b;
  border-radius: 4px;
}
.trans-line { margin-bottom: 6px; }
.badge {
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
}
.red { background:#dc2626; }
.black { background:#000; }
.green { background:#16a34a; }
</style>
</head>
<body>

<h1>🎡 RulettStadistic – Ruleta Europea</h1>

<div class="box">
  <input type="number" id="num" placeholder="Introduce número (0-36)">
  <button onclick="addNumber()">Añadir número</button>
</div>

<div class="box">
  <textarea id="bulk" placeholder="Pega muchos números (ej: 17,4,32,0,9)"></textarea>
  <button onclick="addBulk()">Añadir lista</button>
</div>

<div class="box">
  <h3>Historial</h3>
  <div id="history"></div>
</div>

<div class="box">
  <h3>Transiciones (después de cada número)</h3>
  <div id="transitions"></div>
</div>

<script>
let historyArr = [];
let colors = {0:'green',1:'red',2:'black',3:'red',4:'black',5:'red',6:'black',7:'red',8:'black',9:'red',10:'black',11:'black',12:'red',13:'black',14:'red',15:'black',16:'red',17:'black',18:'red',19:'red',20:'black',21:'red',22:'black',23:'red',24:'black',25:'red',26:'black',27:'red',28:'black',29:'red',30:'black',31:'black',32:'red',33:'black',34:'red',35:'black',36:'red'};
let parImpar = n => n===0 ? "N/A" : n%2===0 ? "Par" : "Impar";
let altoBajo = n => n>=1 && n<=18 ? "Bajo" : n>=19 ? "Alto" : "N/A";

function addNumber(){
  let n = parseInt(document.getElementById("num").value);
  if(isNaN(n)||n<0||n>36) return;
  historyArr.push(n);
  document.getElementById("num").value="";
  render();
}

function addBulk(){
  let txt = document.getElementById("bulk").value;
  txt.split(/[\s,;]+/).forEach(v=>{
    let n=parseInt(v);
    if(!isNaN(n)&&n>=0&&n<=36) historyArr.push(n);
  });
  document.getElementById("bulk").value="";
  render();
}

function render(){
  document.getElementById("history").innerHTML =
    historyArr.map(n=>`<span class="number">${n}</span>`).join("");

  let trans={};
  for(let i=0;i<historyArr.length-1;i++){
    let a=historyArr[i], b=historyArr[i+1];
    if(!trans[a]) trans[a]={};
    trans[a][b]=(trans[a][b]||0)+1;
  }

  let html="";
  Object.keys(trans).sort((a,b)=>a-b).forEach(n=>{
    html+=`<div class="trans-line"><b>${n} →</b><br>`;
    Object.keys(trans[n]).sort((a,b)=>trans[n][b]-trans[n][a]).forEach(x=>{
      html+=`${x} · 
        <span class="badge ${colors[x]}">${colors[x]}</span> · 
        ${parImpar(x)} · ${altoBajo(x)} 
        (${trans[n][x]} veces)<br>`;
    });
    html+=`</div>`;
  });
  document.getElementById("transitions").innerHTML=html;
}
</script>

</body>
</html>
